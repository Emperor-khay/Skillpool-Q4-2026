        <h1 class="font-bold text-[36px] leading-[28px]  text-[#2E8B57]">Skillpool</h1>

        <!-- Navlinks and Action Button Grouped -->
        <div class="flex items-center gap-[20px] sm:gap-[50px] md:gap-[111px]">

            <!-- <div class="nav_links">
                <a href="">Home</a>
                <a href="">How It Works</a>
                <a href="">About</a>
                <a href="">Contact Us</a>
            </div> -->
            <div class="md:flex gap-4 items-center hidden">
                <a href="" class="hover:bg-[#2E8B57] hover:text-white hover:rounded-[30px] hover:transition-colors hover:duration-500 py-2 px-3 font-medium text-base/5">Home</a>
                <a href="" class="hover:bg-[#2E8B57] hover:text-white hover:rounded-[30px] hover:transition-colors hover:duration-500 py-2 px-3 font-medium text-base/5">How It Works</a>
                <a href="" class="hover:bg-[#2E8B57] hover:text-white hover:rounded-[30px] hover:transition-colors hover:duration-500 py-2 px-3 font-medium text-base/5">About</a>
                <a href="" class="hover:bg-[#2E8B57] hover:text-white hover:rounded-[30px] hover:transition-colors hover:duration-500 py-2 px-3 font-medium text-base/5">Contact Us</a>
            </div>

            <!-- <a href="" class="action_button1">Post A Job</a> -->
            <a href="" class="w-[137px] h-12 flex bg-[#FF6A3D] rounded-[30px] text-white justify-center items-center">Post A Job</a>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 inline-block md:hidden">

            </svg>

        </div>

    <section class="bg-[url('./images/hero-con-image1.webp')] bg-no-repeat bg-cover text-white relative">

        <!-- Overlay -->
        <div class="w-full bg-[#000000B2] absolute inset-0 z-1"></div>

        <!-- Hero Section -->
        <div class="relative z-2 flex gap-12.5 flex-col sm:flex-row sm:gap-25 justify-center h-fit py-10 sm:h-[78vh] items-center">
            <div class="text-center flex flex-col items-center gap-[10px]">
                <span class="bg-[#FF6A3D] py-[21px] px-[19px] inline-block rounded-[37px] border-5 border-[#885748]">
                    <img src="./images/icons/hero_icon_1.svg" alt="" height="32px" width="36px">
                </span>
                <p class="font-normal text-[32px]/[38.4px]">Are you an employer <br> looking to hire skilled <br> professionals?</p>
                <a href="" class="border-2 border-[#FF6A3D] text-white py-[15px] px-[30px] inline-block rounded-[30px]">
                    GET STARTED
                    &nbsp;
                    <img src="./images/icons/white_arrow.svg" alt="" class="inline"> 
                </a>
            </div>

            <div class="text-center flex flex-col items-center gap-[10px]">
                <span class="size-[74px] rounded-[37px] bg-[#2E8B57] flex justify-center items-center border-5 border-[#3f5f4e] ">
                    <img src="./images/icons/hero_icon_2.svg" width="30px" height="32px" alt="">
                </span>
                <!-- <span class="hero_icon_2_outline">
                </span> -->
                <p class="font-normal text-[32px]/[38.4px]">Are you a <br> candidate looking <br> for a job?</p>
                <a href="" class="border-2 border-[#2E8B57] text-white py-[15px] px-[30px] inline-block rounded-[30px]">
                    GET STARTED
                    &nbsp;
                    <img src="./images/icons/white_arrow.svg" alt="" class="inline"> 
                </a>
            </div>
        </div>
    </section>
